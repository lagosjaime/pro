; Pool de php-fpm para desarrollo.
; Sustituye al www.conf de la imagen oficial: sin directivas user/group
; para que los workers hereden el UID del host (docker-compose user:).
[www]

listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

access.log = /proc/self/fd/2
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
